<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="DONNIE TRUMP">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="35%" stop-color="#f2c14e"/>
      <stop offset="70%" stop-color="#c99212"/>
      <stop offset="100%" stop-color="#8a5a00"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#b67900"/>
    </linearGradient>
  </defs>
  <rect width="900" height="280" fill="#0b1a3a"/>
  <rect x="14" y="14" width="872" height="252" fill="none" stroke="url(#goldEdge)" stroke-width="6"/>
  <rect x="28" y="28" width="844" height="224" fill="none" stroke="#c99212" stroke-width="1.5"/>

  <!-- cheap commemorative seal -->
  <g transform="translate(92,140)">
    <circle r="68" fill="#7a0f16" stroke="#f2c14e" stroke-width="6"/>
    <circle r="54" fill="none" stroke="#ffe9a0" stroke-width="2"/>
    <circle r="22" fill="#f2c14e"/>
    <text text-anchor="middle" y="8" font-family="Times New Roman, serif" font-size="22" font-weight="700" fill="#7a0f16">DT</text>
    <text text-anchor="middle" y="-34" font-family="Times New Roman, serif" font-size="9" letter-spacing="2" fill="#ffe9a0">TREMENDOUS</text>
    <text text-anchor="middle" y="46" font-family="Times New Roman, serif" font-size="9" letter-spacing="2" fill="#ffe9a0">ARCHIVE</text>
  </g>

  <text x="190" y="128" font-family="Times New Roman, Georgia, serif" font-size="72" font-weight="700" letter-spacing="6" fill="url(#gold)">DONNIE</text>
  <text x="190" y="198" font-family="Times New Roman, Georgia, serif" font-size="72" font-weight="700" letter-spacing="10" fill="url(#gold)">TRUMP</text>
  <rect x="190" y="214" width="430" height="6" fill="#c8102e"/>
  <text x="190" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3.5" fill="#ffe9a0">VERY FAIR. VERY ACCURATE. EVERYBODY SAYS SO.</text>
</svg>
